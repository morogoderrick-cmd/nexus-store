<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>NEXUS Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d;--sf:#0f0f1c;--sf2:#181826;--bd:#252540;
  --ac:#7c6af7;--ac2:#f76a8a;--ac3:#3effa0;--ac4:#ffc832;
  --tx:#eeeeff;--mt:#7777aa;--cd:#111120;--r:14px;--rs:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--ac);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:64px;background:rgba(7,7,13,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-.04em;background:linear-gradient(130deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;user-select:none;}
.nav-links{display:flex;gap:1.8rem;list-style:none;}
.nav-links a{color:var(--mt);text-decoration:none;font-size:.88rem;font-weight:500;cursor:pointer;transition:color .2s;}
.nav-links a:hover{color:var(--tx);}
.nav-right{display:flex;align-items:center;gap:.7rem;}
.btn-cart{position:relative;display:flex;align-items:center;gap:.4rem;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:.45rem 1rem;border-radius:50px;cursor:pointer;font:.88rem 'DM Sans',sans-serif;transition:all .2s;}
.btn-cart:hover{border-color:var(--ac);}
.badge{position:absolute;top:-6px;right:-6px;background:var(--ac2);color:#fff;width:19px;height:19px;border-radius:50%;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.btn-np{background:linear-gradient(135deg,var(--ac),#5748d4);border:none;color:#fff;padding:.45rem 1.2rem;border-radius:50px;cursor:pointer;font:.88rem 'DM Sans',sans-serif;transition:opacity .2s;}
.btn-np:hover{opacity:.85;}

/* PAGES */
.page{display:none;padding-top:64px;}
.page.active{display:block;}

/* HERO */
.hero{min-height:calc(100vh - 64px);display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 70% 40%,rgba(124,106,247,.1) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 20% 70%,rgba(247,106,138,.07) 0%,transparent 60%);}
.hero-in{max-width:1200px;margin:0 auto;padding:3rem 2rem;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
.hero-tag{display:inline-flex;align-items:center;gap:.5rem;background:rgba(124,106,247,.12);border:1px solid rgba(124,106,247,.3);padding:.32rem .9rem;border-radius:50px;font-size:.75rem;color:var(--ac);font-weight:600;margin-bottom:1.2rem;animation:fu .6s ease both;}
.dp{width:6px;height:6px;background:var(--ac3);border-radius:50%;animation:bl 2s infinite;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.hero h1{font-family:'Syne',sans-serif;font-size:clamp(2.4rem,4.5vw,4.2rem);font-weight:800;line-height:1.0;letter-spacing:-.04em;margin-bottom:1.2rem;animation:fu .6s .1s ease both;}
.hero h1 em{font-style:normal;background:linear-gradient(130deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:var(--mt);font-size:.98rem;line-height:1.75;margin-bottom:2rem;animation:fu .6s .2s ease both;}
.hero-btns{display:flex;gap:.8rem;flex-wrap:wrap;animation:fu .6s .3s ease both;}
.bp{background:linear-gradient(135deg,var(--ac),#5748d4);border:none;color:#fff;padding:.8rem 1.8rem;border-radius:50px;cursor:pointer;font:500 .95rem 'DM Sans',sans-serif;box-shadow:0 8px 28px rgba(124,106,247,.3);transition:all .2s;}
.bp:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(124,106,247,.4);}
.bg{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:.8rem 1.8rem;border-radius:50px;cursor:pointer;font:500 .95rem 'DM Sans',sans-serif;transition:all .2s;}
.bg:hover{border-color:var(--ac);color:var(--ac);}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;animation:fu .7s .15s ease both;}
.hg-item{border-radius:var(--r);overflow:hidden;cursor:pointer;border:1px solid var(--bd);transition:transform .3s,border-color .3s;}
.hg-item:nth-child(2){margin-top:2rem;}
.hg-item:nth-child(3){margin-top:-1rem;}
.hg-item:hover{transform:translateY(-5px);border-color:rgba(124,106,247,.5);}
.hg-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* MARQUEE */
.mq-wrap{background:var(--sf);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:.65rem 0;overflow:hidden;}
.mq{display:flex;gap:2rem;animation:mqs 25s linear infinite;width:max-content;}
@keyframes mqs{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mq span{font-size:.78rem;font-weight:600;color:var(--mt);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
.mq span b{color:var(--ac);}

/* SECTIONS */
.sec{max-width:1200px;margin:0 auto;padding:4rem 2rem;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;}
.sec-t{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.4rem,2.5vw,2rem);letter-spacing:-.03em;}
.sec-t span{background:linear-gradient(130deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sec-s{color:var(--mt);font-size:.8rem;margin-top:.25rem;}
.view-all{background:transparent;border:1px solid var(--bd);color:var(--mt);padding:.38rem .85rem;border-radius:50px;cursor:pointer;font:.8rem 'DM Sans',sans-serif;transition:all .2s;}
.view-all:hover{border-color:var(--ac);color:var(--ac);}

/* CAT PILLS */
.cat-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem;}
.cp{background:var(--sf2);border:1px solid var(--bd);border-radius:50px;padding:.4rem 1rem;font:.8rem 'DM Sans',sans-serif;font-weight:500;color:var(--mt);cursor:pointer;transition:all .2s;}
.cp:hover,.cp.active{background:rgba(124,106,247,.12);border-color:var(--ac);color:var(--ac);}

/* PRODUCT GRID */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem;}
.pc{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .3s;position:relative;}
.pc:hover{transform:translateY(-5px);border-color:rgba(124,106,247,.4);box-shadow:0 20px 50px rgba(0,0,0,.5);}
.pc-img{position:relative;overflow:hidden;background:var(--sf2);}
.pc-img img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .4s;}
.pc:hover .pc-img img{transform:scale(1.06);}
.pbg{position:absolute;top:8px;left:8px;padding:.18rem .55rem;border-radius:50px;font-size:.66rem;font-weight:700;z-index:2;}
.pbg.hot{background:var(--ac2);color:#fff;}
.pbg.new{background:var(--ac3);color:#000;}
.pbg.sale{background:var(--ac4);color:#000;}
.pc-info{padding:.9rem;}
.pc-cat{font-size:.68rem;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;font-weight:600;}
.pc-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;margin-bottom:.55rem;line-height:1.3;}
.pc-bot{display:flex;align-items:center;justify-content:space-between;}
.pc-price{font-size:1rem;font-weight:700;color:var(--ac);}
.pc-stars{font-size:.7rem;color:#f5a623;}
.btn-addpc{position:absolute;bottom:.7rem;right:.7rem;background:var(--ac);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;opacity:0;box-shadow:0 4px 15px rgba(124,106,247,.4);}
.pc:hover .btn-addpc{opacity:1;}

/* CART SIDEBAR */
.cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);z-index:600;opacity:0;pointer-events:none;transition:opacity .3s;}
.cart-ov.open{opacity:1;pointer-events:all;}
.cart-pan{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:var(--sf);border-left:1px solid var(--bd);z-index:601;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.68,0,1.2);display:flex;flex-direction:column;}
.cart-pan.open{transform:translateX(0);}
.cart-hd{padding:1.2rem 1.5rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.cart-hd h2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;}
.bx{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s;border:none;}
.bx:hover{background:var(--ac2);}
.cart-bd{flex:1;overflow-y:auto;padding:1rem;}
.ci{display:flex;gap:.8rem;align-items:center;padding:.8rem;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:.6rem;}
.ci-img{width:55px;height:55px;border-radius:var(--rs);overflow:hidden;flex-shrink:0;background:var(--sf2);}
.ci-img img{width:100%;height:100%;object-fit:cover;}
.ci-info{flex:1;}
.ci-name{font-weight:600;font-size:.82rem;margin-bottom:.2rem;line-height:1.2;}
.ci-price{color:var(--ac);font-size:.8rem;font-weight:700;}
.ci-qty{display:flex;align-items:center;gap:.4rem;}
.qb{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.qb:hover{border-color:var(--ac);color:var(--ac);}
.brm{background:none;border:none;color:var(--mt);cursor:pointer;font-size:1rem;padding:.2rem;transition:color .2s;}
.brm:hover{color:var(--ac2);}
.cart-empty{text-align:center;padding:3rem;color:var(--mt);}
.cart-ft{padding:1.2rem;border-top:1px solid var(--bd);}
.c-row{display:flex;justify-content:space-between;font-size:.86rem;color:var(--mt);margin-bottom:.4rem;}
.c-row.tot{color:var(--tx);font-weight:700;font-size:1rem;border-top:1px solid var(--bd);padding-top:.65rem;margin-top:.65rem;}
.btn-co{width:100%;background:linear-gradient(135deg,#1a5c35,#2ecc71);border:none;color:#fff;padding:.85rem;border-radius:var(--r);cursor:pointer;font:600 .9rem 'DM Sans',sans-serif;margin-top:.8rem;transition:all .2s;}
.btn-co:hover{opacity:.9;}

/* PAYMENT MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);z-index:700;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);max-width:520px;width:100%;max-height:92vh;overflow-y:auto;transform:scale(.95);transition:transform .3s;}
.modal-ov.open .modal{transform:scale(1);}
.modal-hd{padding:1.2rem 1.5rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.modal-hd h2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;}
.modal-bd{padding:1.5rem;}

/* PAYMENT TABS */
.pay-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.5rem;}
.pay-tab{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:.8rem .5rem;text-align:center;cursor:pointer;transition:all .2s;}
.pay-tab:hover,.pay-tab.active{border-color:var(--ac);background:rgba(124,106,247,.1);}
.pay-tab .pt-ico{font-size:1.6rem;margin-bottom:.3rem;}
.pay-tab .pt-lbl{font-size:.75rem;font-weight:600;color:var(--mt);}
.pay-tab.active .pt-lbl{color:var(--ac);}
.pay-section{display:none;}
.pay-section.active{display:block;}

/* MPESA */
.mpesa-logo{background:linear-gradient(135deg,#00a550,#00d261);border-radius:var(--rs);padding:1rem;text-align:center;margin-bottom:1rem;}
.mpesa-logo h3{color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;}
.mpesa-logo p{color:rgba(255,255,255,.8);font-size:.78rem;}
.mpesa-steps{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rs);padding:1rem;margin-bottom:1rem;}
.mpesa-steps ol{padding-left:1.2rem;color:var(--mt);font-size:.85rem;line-height:2.1;}
.mpesa-steps ol li strong{color:var(--tx);}
.paybill-info{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem;}
.pb-item{background:rgba(0,165,80,.1);border:1px solid rgba(0,165,80,.3);border-radius:var(--rs);padding:.8rem;text-align:center;}
.pb-label{font-size:.68rem;color:var(--mt);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem;}
.pb-val{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:#00a550;}

/* CARD */
.card-banks{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem;}
.bank-opt{background:var(--cd);border:2px solid var(--bd);border-radius:var(--rs);padding:.7rem .4rem;text-align:center;cursor:pointer;transition:all .2s;}
.bank-opt:hover,.bank-opt.sel{border-color:var(--ac);background:rgba(124,106,247,.08);}
.bank-opt .bico{font-size:1.4rem;margin-bottom:.2rem;}
.bank-opt .bnm{font-size:.68rem;font-weight:600;color:var(--mt);}
.bank-opt.sel .bnm{color:var(--ac);}
.card-form{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:1.2rem;margin-top:.8rem;}
.card-visual{background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;position:relative;overflow:hidden;}
.card-visual::before{content:'';position:absolute;top:-30%;right:-20%;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);}
.card-chip{font-size:1.5rem;margin-bottom:.8rem;}
.card-number{font-family:'Syne',sans-serif;font-size:1.1rem;letter-spacing:.15em;color:#fff;margin-bottom:.8rem;}
.card-meta{display:flex;justify-content:space-between;font-size:.75rem;color:rgba(255,255,255,.7);}

/* FORM */
.fg{margin-bottom:.85rem;}
.fg label{display:block;font-size:.76rem;font-weight:600;color:var(--mt);margin-bottom:.3rem;}
.fg input,.fg select{width:100%;padding:.65rem .9rem;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font:.88rem 'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus{border-color:var(--ac);}
.fg input::placeholder{color:var(--mt);}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.btn-pay{width:100%;padding:.9rem;border-radius:var(--r);border:none;cursor:pointer;font:600 .95rem 'DM Sans',sans-serif;transition:all .2s;margin-top:.6rem;}
.btn-pay.mpesa{background:linear-gradient(135deg,#00a550,#00d261);color:#fff;}
.btn-pay.card{background:linear-gradient(135deg,var(--ac),#5748d4);color:#fff;}
.btn-pay.whatsapp{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;}
.btn-pay:hover{opacity:.9;transform:translateY(-1px);}

/* PRODUCT DETAIL */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
.pd-imgbox{border-radius:var(--r);overflow:hidden;background:var(--sf2);}
.pd-imgbox img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.pd-cat{font-size:.68rem;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;font-weight:600;}
.pd-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;margin-bottom:.6rem;line-height:1.2;}
.pd-stars{margin-bottom:.6rem;font-size:.86rem;}
.pd-price{font-size:1.5rem;font-weight:700;color:var(--ac);margin-bottom:.8rem;}
.pd-desc{color:var(--mt);font-size:.86rem;line-height:1.7;margin-bottom:1rem;}
.pd-stock{font-size:.73rem;padding:.22rem .65rem;border-radius:50px;display:inline-flex;align-items:center;gap:.3rem;margin-bottom:1rem;}
.pd-stock.in{background:rgba(62,255,160,.1);border:1px solid rgba(62,255,160,.3);color:var(--ac3);}
.pd-stock.out{background:rgba(247,106,138,.1);border:1px solid rgba(247,106,138,.3);color:var(--ac2);}
.btn-adf{width:100%;background:linear-gradient(135deg,var(--ac),#5748d4);border:none;color:#fff;padding:.82rem;border-radius:var(--r);cursor:pointer;font:600 .92rem 'DM Sans',sans-serif;transition:all .2s;margin-bottom:.5rem;}
.btn-wl{width:100%;background:transparent;border:1px solid var(--bd);color:var(--mt);padding:.72rem;border-radius:var(--r);cursor:pointer;font:.88rem 'DM Sans',sans-serif;transition:all .2s;}
.btn-wl:hover{border-color:var(--ac2);color:var(--ac2);}

/* AUTH */
.auth-tabs{display:flex;background:var(--sf2);border-radius:var(--rs);padding:.2rem;margin-bottom:1.2rem;}
.at{flex:1;padding:.52rem;text-align:center;border-radius:6px;cursor:pointer;font:.83rem 'DM Sans',sans-serif;font-weight:500;color:var(--mt);transition:all .2s;}
.at.active{background:var(--ac);color:#fff;}

/* ACCOUNT PAGE */
.acct-lay{max-width:1100px;margin:0 auto;padding:2.5rem 2rem;display:grid;grid-template-columns:230px 1fr;gap:2rem;}
.acct-side{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.5rem;height:fit-content;}
.acct-av{width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 1rem;}
.acct-nm{text-align:center;font-family:'Syne',sans-serif;font-weight:700;margin-bottom:.25rem;}
.acct-em{text-align:center;color:var(--mt);font-size:.76rem;margin-bottom:1.2rem;}
.ami{padding:.6rem .8rem;border-radius:var(--rs);cursor:pointer;font-size:.83rem;font-weight:500;color:var(--mt);transition:all .2s;margin-bottom:.2rem;display:flex;align-items:center;gap:.6rem;}
.ami:hover,.ami.active{color:var(--ac);background:rgba(124,106,247,.1);}
.acct-main{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.8rem;}
.asec{display:none;}
.asec.active{display:block;}
.ord-card{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;margin-bottom:.8rem;}
.ord-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;}
.ord-id{font-family:'Syne',sans-serif;font-weight:700;color:var(--ac);font-size:.92rem;}
.spill{padding:.18rem .65rem;border-radius:50px;font-size:.68rem;font-weight:700;}
.spill.delivered{background:rgba(62,255,160,.1);border:1px solid rgba(62,255,160,.3);color:var(--ac3);}
.spill.pending{background:rgba(255,200,50,.1);border:1px solid rgba(255,200,50,.3);color:var(--ac4);}
.spill.processing{background:rgba(124,106,247,.1);border:1px solid rgba(124,106,247,.3);color:var(--ac);}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;}
.wc{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.wc:hover{border-color:var(--ac);}
.wc img{width:100%;aspect-ratio:1;object-fit:cover;}
.wc-info{padding:.75rem;}
.wc-nm{font-weight:600;font-size:.8rem;margin-bottom:.25rem;}
.wc-pr{color:var(--ac);font-size:.8rem;font-weight:700;}
.wc-rm{position:absolute;top:.4rem;right:.4rem;background:var(--ac2);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;}

/* INFO PAGE */
.info-hero{background:linear-gradient(135deg,rgba(124,106,247,.1),rgba(247,106,138,.05));border-bottom:1px solid var(--bd);padding:4rem 2rem;text-align:center;}
.info-hero h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.8rem,4vw,3.2rem);margin-bottom:.9rem;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-bottom:2.5rem;}
.ic{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.8rem;text-align:center;transition:border-color .2s;}
.ic:hover{border-color:var(--ac);}
.ic .iico{font-size:2.2rem;margin-bottom:.8rem;}
.ic h3{font-family:'Syne',sans-serif;font-weight:700;margin-bottom:.5rem;}
.ic p{color:var(--mt);font-size:.85rem;line-height:1.65;}
.contact-block{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.8rem;margin-bottom:1.5rem;}

async function login(){const ad=admins(),e=$('le').value.trim().toLowerCase(),pw=$('lp').value;if(!e||pw.length<6)return toast('Enter email and a password of 6+ characters','err');const p=await sha(pw);
 if(!ad.length){ad.push({name:$('ln').value.trim()||'Admin',email:e,pass:p});LS.set('nexus_admins',ad)}
 const a=ad.find(x=>x.email===e&&x.pass===p);if(!a)return toast('Invalid admin login','err');sessionStorage.nxa=a.email;enter()}
function logout(){sessionStorage.removeItem('nxa');location.reload()}
const TABS=[['dash','📊 Dashboard'],['prod','📦 Products'],['ord','🧾 Orders'],['promo','🏷️ Promotions'],['store','🏬 Store'],['adm','👤 Admins'],['exp','📥 Export']];
function enter(){$('auth').style.display='none';$('app').style.display='block';const me=admins().find(a=>a.email===sessionStorage.nxa);$('who').textContent=me?me.name:'';
 $('side').innerHTML=TABS.map(t=>`<div class="adm-ni" id="n-${t[0]}" onclick="tab('${t[0]}')">${t[1]}</div>`).join('');$('pc').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');tab('dash')}
function tab(t){cat=getCatalog();document.querySelectorAll('.sec-a').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.adm-ni').forEach(x=>x.classList.remove('on'));$('s-'+t).classList.add('on');$('n-'+t).classList.add('on');({dash,prod,ord,promo,store,adm,exp})[t]()}
function bars(rows,fmt){const m=Math.max(1,...rows.map(r=>r[1]));return rows.length?rows.map(r=>`<div class="hb"><span>${esc(r[0])}</span><div><i style="width:${r[1]/m*100}%"></i></div><b>${fmt(r[1])}</b></div>`).join(''):'<div class="empty">No sales yet — charts fill in as orders come in.</div>'}
function dash(){const o=orders(),live=o.filter(x=>x.status!=='cancelled'),rev=live.reduce((t,x)=>t+x.total,0),low=cat.filter(p=>p.stock<10),byC={},byP={};
 live.forEach(x=>x.items.forEach(i=>{const p=cat.find(c=>c.id===i.id),k=p?p.cat:'Other';byC[k]=(byC[k]||0)+i.price*i.qty;byP[i.name]=(byP[i.name]||0)+i.qty}));
 $('s-dash').innerHTML=`<div class="adm-bar"><h1>Dashboard</h1></div><div class="sg"><div class="sc"><div class="sl">Revenue</div><div class="sv" style="color:var(--ac)">${kes(rev)}</div></div><div class="sc"><div class="sl">Orders</div><div class="sv">${live.length}</div></div><div class="sc"><div class="sl">Products</div><div class="sv">${cat.length}</div></div><div class="sc"><div class="sl">Low stock</div><div class="sv ${low.length?'low':''}">${low.length}</div></div></div>
 <div class="card"><h3>⚠️ Low stock (under 10)</h3>${low.length?low.map(p=>`<div class="hb" style="grid-template-columns:1fr 60px 70px"><span>${esc(p.name)}</span><b class="low">${p.stock} left</b><button class="tb" onclick="openProd(${p.id})">Restock</button></div>`).join(''):'<div class="empty">All products are well stocked ✅</div>'}</div>
 <div class="card"><h3>Sales by category</h3>${bars(Object.entries(byC).sort((a,b)=>b[1]-a[1]),kes)}</div><div class="card"><h3>Top selling products</h3>${bars(Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,5),n=>n+' sold')}</div>
 <div class="tw"><div class="th"><h3>Recent orders</h3></div><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody>${o.slice(-5).reverse().map(x=>`<tr onclick="openOrd('${x.id}')" style="cursor:pointer"><td style="color:var(--ac);font-weight:600">${esc(x.id)}</td><td>${esc(x.customer)}</td><td>${kes(x.total)}</td><td><span class="spill ${x.status}">${x.status}</span></td><td>${esc(x.date)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty" style="padding:1rem">No orders yet</td></tr>'}</tbody></table></div>`}
function prod(){$('s-prod').innerHTML=`<div class="adm-bar"><h1>Products (${cat.length})</h1><button class="bp" style="font-size:.8rem;padding:.45rem .9rem" onclick="openProd()">+ Add product</button></div><div class="tw"><table><thead><tr><th>Photo</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${cat.map(p=>`<tr><td><img class="pt" src="${esc(p.img)}"></td><td style="font-weight:600">${esc(p.name)}</td><td style="color:var(--mt)">${esc(p.cat)}</td><td style="color:var(--ac)">${kes(p.price)}</td><td class="${p.stock<10?'low':''}">${p.stock}</td><td><button class="tb" onclick="openProd(${p.id})">Edit</button> <button class="tb del" onclick="delProd(${p.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function openProd(id){editId=id||null;photo='';const p=cat.find(x=>x.id===id)||{};$('pmt').textContent=id?'Edit product':'Add product';$('pn').value=p.name||'';$('pc').value=p.cat||CATS[0];$('pp').value=p.price||'';$('ps').value=p.stock==null?'':p.stock;$('pb').value=p.badge||'';$('pd').value=p.desc||'';const im=$('pprev');im.src=p.img||'';im.style.display=p.img?'block':'none';$('pm').classList.add('open')}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.8);$('pprev').src=photo;$('pprev').style.display='block'};im.src=e.target.result};r.readAsDataURL(f)}
function saveProd(){const n=$('pn').value.trim(),pr=parseInt($('pp').value);if(!n||!(pr>0))return toast('Name and a price are required','err');const d={name:n,cat:$('pc').value,price:pr,stock:parseInt($('ps').value)||0,badge:$('pb').value,desc:$('pd').value};
 if(editId){const p=cat.find(x=>x.id===editId);Object.assign(p,d);if(photo)p.img=photo}else cat.unshift({id:Date.now(),rating:0,reviews:0,img:photo||'images/desk.jpg',...d});
 if(!saveCatalog(cat)){cat=getCatalog();return}cm('pm');toast('✅ Saved — live on the store');prod()}
function delProd(id){if(!confirm('Delete this product?'))return;cat=cat.filter(p=>p.id!==id);saveCatalog(cat);prod();toast('Deleted','err')}
const lbl=o=>({pending:'Pending',processing:'Packing',shipped:o.pickup?'Ready for pickup':'Out for delivery',delivered:o.pickup?'Collected':'Delivered',cancelled:'Cancelled'})[o.status];
function ord(){const f=window._f||'';const o=orders().filter(x=>!f||x.status===f).reverse();$('s-ord').innerHTML=`<div class="adm-bar"><h1>Orders</h1><select onchange="window._f=this.value;ord()" class="row" style="padding:.5rem;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px"><option value="">All statuses</option>${ST.map(s=>`<option ${f===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Delivery</th><th>Status</th><th>Date</th></tr></thead><tbody>${o.map(x=>`<tr onclick="openOrd('${x.id}')" style="cursor:pointer"><td style="color:var(--ac);font-weight:600">${esc(x.id)}</td><td>${esc(x.customer)}</td><td>${kes(x.total)}</td><td style="color:var(--mt)">${esc(x.area||'—')}</td><td><span class="spill ${x.status}">${lbl(x)}</span></td><td>${esc(x.date)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty" style="padding:1rem">No orders yet</td></tr>'}</tbody></table></div>`}
function openOrd(id){const x=orders().find(o=>o.id===id);if(!x)return;let p=(x.phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='254'+p.slice(1);const msg=encodeURIComponent(`Hello ${x.customer}, your NEXUS Store order ${x.id.replace('#','')} is now: ${lbl(x)}.`);
 $('omt').textContent=x.id;$('omb').innerHTML=`<div class="trk-meta" style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;font-size:.84rem;margin-bottom:1rem"><div><b style="display:block;color:var(--mt);font-size:.65rem">CUSTOMER</b>${esc(x.customer)}</div><div><b style="display:block;color:var(--mt);font-size:.65rem">PHONE</b>${esc(x.phone||'—')}</div><div><b style="display:block;color:var(--mt);font-size:.65rem">DELIVERY</b>${esc(x.area||'—')}</div><div><b style="display:block;color:var(--mt);font-size:.65rem">PAYMENT</b>${esc(x.payment||'—')}</div></div>
 ${x.items.map(i=>`<div class="hb" style="grid-template-columns:1fr 40px 90px"><span>${esc(i.name)}</span><b>×${i.qty}</b><b>${kes(i.price*i.qty)}</b></div>`).join('')}${x.discount?`<div class="hb" style="grid-template-columns:1fr 90px"><span>Code ${esc(x.code)}</span><b>− ${kes(x.discount)}</b></div>`:''}<div class="hb" style="grid-template-columns:1fr 90px"><span>Delivery</span><b>${kes(x.fee)}</b></div><div class="hb" style="grid-template-columns:1fr 110px;font-size:1rem"><span><b>Total</b></span><b style="color:var(--ac)">${kes(x.total)}</b></div>
 <div class="row" style="margin-top:1rem"><select id="os">${ST.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="bp" style="padding:.55rem 1.1rem;font-size:.85rem" onclick="setSt('${x.id}')">Update status</button></div>
 <div class="row"><a class="btn-pay whatsapp" style="text-decoration:none;text-align:center;margin:0;flex:1" target="_blank" rel="noopener" href="https://wa.me/${p}?text=${msg}">💬 Message customer</a><button class="bg" style="padding:.7rem 1rem" onclick="printNote('${x.id}')">🖨️ Print note</button></div>`;$('om').classList.add('open')}
function setSt(id){const o=orders(),x=o.find(i=>i.id===id);x.status=$('os').value;LS.set('nexus_orders',o);cm('om');toast('Status: '+lbl(x));({dash,ord})[document.querySelector('.sec-a.on').id.slice(2)]&&({dash,ord})[document.querySelector('.sec-a.on').id.slice(2)]()}
function printNote(id){const x=orders().find(o=>o.id===id),w=window.open('','_blank');w.document.write(`<body style="font-family:sans-serif;padding:24px"><h2>NEXUS Store — Delivery Note</h2><p><b>${esc(x.id)}</b> · ${esc(x.date)}</p><p>${esc(x.customer)} · ${esc(x.phone||'')}<br>${esc(x.area||'')}</p><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%"><tr><th>Item</th><th>Qty</th><th>Price</th></tr>${x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${kes(i.price*i.qty)}</td></tr>`).join('')}</table><h3>Total: ${kes(x.total)} (${esc(x.payment||'')})</h3></body>`);w.document.close();w.print()}
function promo(){const cs=getCodes(),sl=LS.get('nexus_sale',{active:false,pct:10,cat:'All',end:''});
 $('s-promo').innerHTML=`<div class="adm-bar"><h1>Promotions</h1></div><div class="card"><h3>🏷️ Discount codes</h3>${cs.map((c,i)=>`<div class="row"><b style="min-width:110px">${esc(c.code)}</b><span>${c.pct}% off</span><button class="tb" onclick="togCode(${i})">${c.active?'✅ Active — turn off':'⏸ Off — turn on'}</button><button class="tb del" onclick="delCode(${i})">Delete</button></div>`).join('')||'<div class="empty">No codes yet.</div>'}<div class="row"><input id="cc" placeholder="CODE e.g. NEXUS10" style="text-transform:uppercase"><input id="cp" type="number" placeholder="% off" style="width:90px"><button class="bp" style="padding:.5rem 1rem" onclick="addCode()">Add code</button></div></div>
 <div class="card"><h3>⚡ Flash sale (shows on the home page with a countdown)</h3><div class="row"><label><input type="checkbox" id="fa" ${sl.active?'checked':''}> Sale is ON</label><input id="fp" type="number" value="${sl.pct}" style="width:80px"> % off <select id="fc"><option>All</option>${CATS.map(c=>`<option ${sl.cat===c?'selected':''}>${c}</option>`).join('')}</select> ends <input id="fe" type="datetime-local" value="${esc(sl.end)}"></div><button class="bp" style="padding:.5rem 1.2rem" onclick="saveSale()">Save flash sale</button></div>`}
function addCode(){const c=$('cc').value.trim().toUpperCase(),p=parseInt($('cp').value);if(!c||!(p>0&&p<=90))return toast('Enter a code and a % between 1 and 90','err');const cs=getCodes();if(cs.some(x=>x.code===c))return toast('Code exists','err');cs.push({code:c,pct:p,active:true});LS.set('nexus_codes',cs);promo()}
function togCode(i){const cs=getCodes();cs[i].active=!cs[i].active;LS.set('nexus_codes',cs);promo()}function delCode(i){const cs=getCodes();cs.splice(i,1);LS.set('nexus_codes',cs);promo()}
function saveSale(){const e=$('fe').value;if($('fa').checked&&(!e||new Date(e)<=new Date()))return toast('Set an end date in the future','err');LS.set('nexus_sale',{active:$('fa').checked,pct:parseInt($('fp').value)||10,cat:$('fc').value,end:e});toast('✅ Flash sale saved')}
function store(){const ar=getAreas(),rv=getReviews(),st=getSettings();
 $('s-store').innerHTML=`<div class="adm-bar"><h1>Store</h1></div><div class="card"><h3>🚚 Delivery areas & fees</h3>${ar.map((a,i)=>`<div class="row"><input class="an" value="${esc(a.name)}" style="flex:1;min-width:180px"><input class="af" type="number" value="${a.fee}" style="width:100px"><button class="tb del" onclick="delArea(${i})">✕</button></div>`).join('')}<button class="tb" onclick="addArea()">+ Add area</button> <button class="bp" style="padding:.5rem 1.1rem" onclick="saveAreas()">Save delivery fees</button></div>
 <div class="card"><h3>⭐ Customer reviews (shown on the home page — add real ones only)</h3>${rv.map((r,i)=>`<div class="row"><span style="flex:1">“${esc(r.text)}” — <b>${esc(r.name)}</b> ${'★'.repeat(r.stars)}</span><button class="tb del" onclick="delRv(${i})">Delete</button></div>`).join('')||'<div class="empty">None yet — the section stays hidden until you add one.</div>'}<div class="row"><input id="rn" placeholder="Customer name"><input id="rt" placeholder="What they said" style="flex:1;min-width:200px"><select id="rs"><option>5</option><option>4</option><option>3</option></select><button class="bp" style="padding:.5rem 1rem" onclick="addRv()">Add</button></div></div>
 <div class="card"><h3>⚙️ Settings</h3><div class="row"><span>Opening hours</span><input id="sh" value="${esc(st.hours)}" style="flex:1;min-width:240px"></div><div class="row"><label><input type="checkbox" id="sr" ${st.showRatings?'checked':''}> Show star ratings on product cards (current numbers are placeholders — turn off until you have real reviews)</label></div><button class="bp" style="padding:.5rem 1.2rem" onclick="saveSet()">Save settings</button></div>`}
const rd=()=>[...document.querySelectorAll('.an')].map((n,i)=>({...getAreas()[i],name:n.value.trim()||'Area',fee:parseInt(document.querySelectorAll('.af')[i].value)||0}));
function saveAreas(){LS.set('nexus_areas',rd());toast('✅ Delivery fees saved')}function addArea(){const a=rd();a.push({name:'New area',fee:200});LS.set('nexus_areas',a);store()}function delArea(i){const a=rd();if(a.length<2)return;a.splice(i,1);LS.set('nexus_areas',a);store()}
function addRv(){const n=$('rn').value.trim(),t=$('rt').value.trim();if(!n||!t)return toast('Add a name and the review','err');const r=getReviews();r.push({name:n,text:t,stars:+$('rs').value});LS.set('nexus_reviews',r);store()}function delRv(i){const r=getReviews();r.splice(i,1);LS.set('nexus_reviews',r);store()}
function saveSet(){LS.set('nexus_settings',{hours:$('sh').value,showRatings:$('sr').checked});toast('✅ Settings saved')}
function adm(){const ad=admins();$('s-adm').innerHTML=`<div class="adm-bar"><h1>Admins (${ad.length}/5)</h1></div><div class="card">${ad.map((a,i)=>`<div class="row"><b style="flex:1">${esc(a.name)} <span style="color:var(--mt);font-weight:400">${esc(a.email)}</span></b>${a.email===sessionStorage.nxa?'<span class="empty">you</span>':`<button class="tb del" onclick="delAdm(${i})">Remove</button>`}</div>`).join('')}</div>
 ${ad.length<5?`<div class="card"><h3>Add an admin</h3><div class="row"><input id="an1" placeholder="Name"><input id="ae1" type="email" placeholder="Email"><input id="ap1" type="password" placeholder="Password (6+)"><button class="bp" style="padding:.5rem 1rem" onclick="addAdm()">Add</button></div></div>`:''}
 <div class="card"><h3>Change my password</h3><div class="row"><input id="np" type="password" placeholder="New password (6+)"><button class="bp" style="padding:.5rem 1rem" onclick="chPw()">Change</button></div></div><p class="empty">Admin accounts are saved in this browser only until the backend is connected.</p>`}
async function addAdm(){const e=$('ae1').value.trim().toLowerCase(),pw=$('ap1').value,ad=admins();if(!e||pw.length<6)return toast('Email and 6+ char password needed','err');if(ad.some(a=>a.email===e))return toast('Already an admin','err');ad.push({name:$('an1').value.trim()||'Admin',email:e,pass:await sha(pw)});LS.set('nexus_admins',ad);adm()}
function delAdm(i){const ad=admins();if(ad.length<2)return;ad.splice(i,1);LS.set('nexus_admins',ad);adm()}
async function chPw(){const pw=$('np').value;if(pw.length<6)return toast('6+ characters','err');const ad=admins();ad.find(a=>a.email===sessionStorage.nxa).pass=await sha(pw);LS.set('nexus_admins',ad);toast('✅ Password changed')}
const csv=(h,r)=>h.join(',')+'\n'+r.map(x=>x.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
function dl(c,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=n;a.click()}
function exp(){$('s-exp').innerHTML=`<div class="adm-bar"><h1>Export to Excel</h1></div><div class="card"><p class="empty" style="margin-bottom:1rem">Downloads .csv files that open directly in Excel.</p><div class="row"><button class="bp" onclick="dl(csv(['ID','Name','Category','Price','Stock','Badge'],cat.map(p=>[p.id,p.name,p.cat,p.price,p.stock,p.badge])),'nexus_products.csv')">📦 Products</button><button class="bp" onclick="dl(csv(['Order','Customer','Phone','Items','Total','Discount code','Delivery area','Payment','Status','Date'],orders().map(o=>[o.id,o.customer,o.phone,o.items.map(i=>i.qty+'x '+i.name).join('; '),o.total,o.code,o.area,o.payment,o.status,o.date])),'nexus_orders.csv')">🧾 Orders</button></div></div>`}
init();
</script></body></html>
